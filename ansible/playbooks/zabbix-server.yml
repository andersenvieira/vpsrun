---
# Instala Zabbix Server + frontend (nginx) + MySQL/MariaDB, importa o schema,
# configura o autoregistro de agentes e (opcional) instala/provisiona o Grafana.
# Idempotente. Alvo: grupo [zabbix_server].
- name: Zabbix Server
  hosts: zabbix_server
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Define a senha do banco UMA vez (cofre/-e ou gerada)
      ansible.builtin.set_fact:
        _zbx_db_pass: "{{ zabbix_db_password if zabbix_db_password | length > 0 else lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Repositório oficial do Zabbix
      ansible.builtin.apt:
        deb: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/debian/pool/main/z/zabbix-release/zabbix-release_latest+debian{{ ansible_distribution_major_version }}_all.deb"
      register: zbx_repo
      failed_when: false

    - name: Atualiza índice apt (tolerante a repositórios de terceiros quebrados)
      # O módulo apt falha se QUALQUER repo do sistema estiver quebrado (ex.: uma
      # chave GPG vencida de k8s/docker pré-existente). Usamos o apt-get direto,
      # que atualiza os repos válidos (incluindo o do Zabbix) e ignora os quebrados.
      ansible.builtin.command: apt-get update
      changed_when: false
      failed_when: false
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Pacotes do servidor Zabbix (nginx + mysql) + libs Python
      ansible.builtin.apt:
        name:
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-nginx-conf
          - zabbix-sql-scripts
          - zabbix-agent2
          - mariadb-server
          - python3-pymysql
          - nmap
        state: present

    - name: Serviço MariaDB ativo (necessário antes de criar o banco)
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
        state: started

    - name: Cria banco do Zabbix
      community.mysql.mysql_db:
        name: "{{ zabbix_db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_bin
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Cria usuário do banco Zabbix
      community.mysql.mysql_user:
        name: "{{ zabbix_db_user }}"
        password: "{{ _zbx_db_pass }}"
        priv: "{{ zabbix_db_name }}.*:ALL"
        host: localhost
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Permite trigger/function sem SUPER (log_bin_trust_function_creators)
      community.mysql.mysql_variables:
        variable: log_bin_trust_function_creators
        value: "1"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Verifica se o schema já foi importado
      community.mysql.mysql_query:
        login_db: "{{ zabbix_db_name }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: "SHOW TABLES LIKE 'users'"
      register: zbx_schema_check
      changed_when: false

    - name: Importa o schema inicial do Zabbix (só na 1ª vez)
      ansible.builtin.shell:
        cmd: >-
          zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz |
          mysql --default-character-set=utf8mb4 -u{{ zabbix_db_user }} -p'{{ _zbx_db_pass }}' {{ zabbix_db_name }}
      when: zbx_schema_check.rowcount is defined and (zbx_schema_check.rowcount[0] | int) == 0
      no_log: true

    - name: Configura DBPassword no zabbix_server.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: "DBPassword={{ _zbx_db_pass }}"
      no_log: true
      notify: reiniciar zabbix-server

    - name: Verifica se a porta 80 já está ocupada (Apache, outro nginx, container…)
      ansible.builtin.shell: "ss -ltn '( sport = :80 )' | grep -q LISTEN && echo busy || echo free"
      register: _port80
      changed_when: false

    - name: Define a porta do frontend Zabbix (80 se livre; senão 8081)
      ansible.builtin.set_fact:
        _fe_port: "{{ zabbix_frontend_port if (zabbix_frontend_port is defined) else ('8081' if _port80.stdout == 'busy' else '80') }}"

    - name: Define a URL base da API (no Debian o frontend nginx serve na raiz)
      ansible.builtin.set_fact:
        zabbix_api_url: "http://127.0.0.1:{{ _fe_port }}"

    - name: Aviso quando a porta 80 está ocupada
      ansible.builtin.debug:
        msg: "Porta 80 ocupada — o frontend do Zabbix vai subir na porta {{ _fe_port }} (ex.: http://IP:{{ _fe_port }}/zabbix)."
      when: _fe_port != '80'

    - name: Frontend nginx — define a porta de escuta
      ansible.builtin.lineinfile:
        path: /etc/zabbix/nginx.conf
        regexp: '^#?\s*listen'
        line: "        listen          {{ _fe_port }};"
      failed_when: false
      notify: reiniciar nginx

    - name: Descobre o serviço php-fpm instalado
      ansible.builtin.shell: "systemctl list-unit-files 'php*-fpm.service' --no-legend | awk '{print $1}' | head -1"
      register: php_fpm_svc
      changed_when: false

    - name: Remove o site default do nginx (evita conflito na porta 80)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reiniciar nginx

    - name: Diretório de config do frontend
      ansible.builtin.file:
        path: /etc/zabbix/web
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Configura o frontend (zabbix.conf.php) para o painel e a API funcionarem
      ansible.builtin.copy:
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: www-data
        group: www-data
        mode: "0640"
        content: |
          <?php
          // Gerado pelo vpsrun.
          $DB['TYPE']          = 'MYSQL';
          $DB['SERVER']        = 'localhost';
          $DB['PORT']          = '0';
          $DB['DATABASE']      = '{{ zabbix_db_name }}';
          $DB['USER']          = '{{ zabbix_db_user }}';
          $DB['PASSWORD']      = '{{ _zbx_db_pass }}';
          $DB['SCHEMA']        = '';
          $DB['ENCRYPTION']    = false;
          $DB['VERIFY_HOST']   = false;
          $DB['DOUBLE_IEEE754'] = true;
          $ZBX_SERVER          = 'localhost';
          $ZBX_SERVER_PORT     = '10051';
          $ZBX_SERVER_NAME     = 'vpsrun';
          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      no_log: true
      notify: reiniciar nginx

    - name: Serviços ativos (inclui php-fpm detectado)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - "{{ php_fpm_svc.stdout | trim }}"
        - zabbix-server
        - zabbix-agent2
        - nginx
      when: item | length > 0

    - name: Aguarda o Zabbix server abrir a porta 10051 (frontend/API dependem)
      ansible.builtin.wait_for:
        port: 10051
        host: 127.0.0.1
        timeout: 60
      failed_when: false

    # ── Autoregistro via API JSON-RPC (sem depender da coleção community.zabbix) ──
    - name: Configura autoregistro de agentes (API do Zabbix 7.0)
      when: zabbix_autoregistration_enabled | bool
      vars:
        # Fala com o frontend local na porta que ele realmente subiu.
        _api: "{{ zabbix_api_url }}/api_jsonrpc.php"
        _hdr: { Content-Type: "application/json-rpc" }
      block:
        - name: Aguarda a API do Zabbix responder
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body: { jsonrpc: "2.0", method: "apiinfo.version", id: 1 }
            headers: "{{ _hdr }}"
          register: zbx_ver
          retries: 30
          delay: 5
          until: zbx_ver.status == 200 and zbx_ver.json.result is defined

        - name: Login na API (Zabbix 7.0 usa 'username' + token Bearer)
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "user.login"
              params: { username: "{{ zabbix_api_user }}", password: "{{ zabbix_api_password }}" }
              id: 2
            headers: "{{ _hdr }}"
          register: zbx_login
          no_log: true
          failed_when: zbx_login.json.result is not defined

        - name: Guarda o token de sessão
          ansible.builtin.set_fact:
            _auth: "{{ _hdr | combine({'Authorization': 'Bearer ' + zbx_login.json.result}) }}"
          no_log: true

        - name: Verifica se o host group já existe
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "hostgroup.get"
              params: { filter: { name: ["{{ zabbix_default_hostgroup }}"] } }
              id: 3
            headers: "{{ _auth }}"
          register: zbx_hg
          no_log: true

        - name: Cria o host group se faltar
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "hostgroup.create"
              params: { name: "{{ zabbix_default_hostgroup }}" }
              id: 4
            headers: "{{ _auth }}"
          register: zbx_hg_new
          when: zbx_hg.json.result | length == 0
          no_log: true

        - name: Resolve o groupid
          ansible.builtin.set_fact:
            _gid: "{{ zbx_hg.json.result[0].groupid if (zbx_hg.json.result | length > 0) else zbx_hg_new.json.result.groupids[0] }}"

        - name: Busca o templateid do 'Linux by Zabbix agent active'
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "template.get"
              params: { filter: { host: ["{{ zabbix_linux_template }}"] } }
              id: 5
            headers: "{{ _auth }}"
          register: zbx_tpl
          no_log: true

        - name: Monta as operações da ação (linka template só se achou)
          ansible.builtin.set_fact:
            _tid: "{{ zbx_tpl.json.result[0].templateid if (zbx_tpl.json.result | length > 0) else '' }}"
            _ops: >-
              {{ [ {'operationtype': 2},
                   {'operationtype': 4, 'opgroup': [{'groupid': _gid}]} ]
                 + ([{'operationtype': 6, 'optemplate': [{'templateid': zbx_tpl.json.result[0].templateid}]}]
                    if (zbx_tpl.json.result | length > 0) else []) }}

        - name: Verifica se a ação de autoregistro já existe
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "action.get"
              params: { filter: { name: ["vpsrun • autoregistro Linux"] } }
              id: 6
            headers: "{{ _auth }}"
          register: zbx_act
          no_log: true

        - name: Cria a ação de autoregistro (add host + grupo + template)
          ansible.builtin.uri:
            url: "{{ _api }}"
            method: POST
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "action.create"
              params:
                name: "vpsrun • autoregistro Linux"
                eventsource: 2
                status: 0
                filter:
                  evaltype: 0
                  conditions:
                    - { conditiontype: 24, operator: 2, value: "{{ zabbix_host_metadata }}" }
                operations: "{{ _ops }}"
              id: 7
            headers: "{{ _auth }}"
          register: zbx_act_new
          when: zbx_act.json.result | length == 0
          failed_when: zbx_act_new.json.error is defined
          no_log: true
      rescue:
        - name: Autoregistro não configurado agora (não é fatal)
          ansible.builtin.debug:
            msg:
              - "AVISO: não configurei o autoregistro via API automaticamente."
              - "O Zabbix está instalado e no ar — isso não impede o uso."
              - "Motivo: {{ ansible_failed_result.msg | default('a API do frontend ainda não respondeu') }}"
              - "Depois rode de novo o playbook, ou crie a ação de autoregistro no frontend."

    - name: Salva as credenciais num arquivo protegido (só root)
      ansible.builtin.copy:
        dest: /root/vpsrun-zabbix.txt
        owner: root
        group: root
        mode: "0600"
        content: |
          vpsrun — credenciais do Zabbix
          Gerado em: {{ ansible_date_time.iso8601 | default('') }}

          Painel Zabbix : http://{{ zabbix_server_ip }}{{ ':' + _fe_port if _fe_port != '80' else '' }}/
          Login inicial : Admin / zabbix   (troque no primeiro acesso)

          Banco de dados '{{ zabbix_db_name }}' (usuário {{ zabbix_db_user }})
          SENHA DO BANCO: {{ _zbx_db_pass }}

          Guarde a senha no cofre:
            vpsrun vault add --group Monitoramento --app Zabbix --type db_password --value '{{ _zbx_db_pass }}'
      no_log: true

    - name: Resumo do servidor
      ansible.builtin.debug:
        msg:
          - ""
          - "═══════════════════════════════════════════════════════════════"
          - "  ✅  ZABBIX {{ zabbix_version }} INSTALADO"
          - ""
          - "  Painel : http://{{ zabbix_server_ip }}{{ ':' + _fe_port if _fe_port != '80' else '' }}/"
          - "  Login  : Admin / zabbix   (TROQUE no primeiro acesso)"
          - "  Auto   : {{ 'agentes ativos entram sozinhos' if zabbix_autoregistration_enabled else 'desligado' }}"
          - "───────────────────────────────────────────────────────────────"
          - "  🔑  SENHA DO BANCO (ANOTE — não some mais nada abaixo dela):"
          - ""
          - "        {{ _zbx_db_pass }}"
          - ""
          - "  Também salva em:  /root/vpsrun-zabbix.txt  (só root, chmod 600)"
          - "═══════════════════════════════════════════════════════════════"
      no_log: false

  handlers:
    - name: reiniciar zabbix-server
      ansible.builtin.systemd:
        name: zabbix-server
        state: restarted
    - name: reiniciar nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

# ── Grafana (opcional) — roda só quando grafana_enabled=true ────────────────
- name: Grafana (opcional)
  hosts: zabbix_server
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Aplica a role grafana quando habilitado
      ansible.builtin.include_role:
        name: grafana
      when: grafana_enabled | bool

    - name: Aviso quando Grafana está desligado
      ansible.builtin.debug:
        msg: "Grafana DESABILITADO — usando os dashboards nativos do Zabbix. Para ligar: grafana_enabled=true e rode o playbook de novo."
      when: not (grafana_enabled | bool)
