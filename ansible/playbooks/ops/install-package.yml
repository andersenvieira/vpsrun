---
# Instalação de pacotes/apps em massa. Multiplataforma.
#
# Uso:
#   ansible-playbook -i inventory.ini playbooks/ops/install-package.yml \
#       -e 'packages=htop,tmux,curl'
#   ... -e 'target=web' -e 'state=latest'
- name: Instalação de pacotes em massa
  hosts: "{{ target | default('all') }}"
  become: true
  vars:
    state: present        # present | latest
  tasks:
    - name: Valida entrada
      ansible.builtin.assert:
        that: packages is defined and (packages | length) > 0
        fail_msg: "Informe -e 'packages=pkg1,pkg2'"

    - name: Normaliza lista de pacotes
      ansible.builtin.set_fact:
        _pkgs: "{{ packages.split(',') | map('trim') | list if packages is string else packages }}"

    - name: (Debian/Ubuntu) Instala
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        name: "{{ _pkgs }}"
        state: "{{ state }}"
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: (RedHat) Instala
      when: ansible_os_family == "RedHat"
      ansible.builtin.dnf:
        name: "{{ _pkgs }}"
        state: "{{ state }}"

    - name: Resumo
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ _pkgs | join(', ') }} → {{ state }}"
