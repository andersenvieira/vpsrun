---
# Hardening básico de segurança para o parque (SOC): firewall, fail2ban,
# atualizações automáticas de segurança e SSH um pouco mais rígido.
# Conservador e idempotente. Não fecha a porta 22.
#
# Uso:
#   ansible-playbook -i inventory.ini playbooks/ops/harden-basic.yml -e 'target=all'
- name: Hardening básico
  hosts: "{{ target | default('all') }}"
  become: true
  vars:
    ssh_permit_root_login: "prohibit-password"   # ou "no"
    allowed_tcp_ports: [22]
  tasks:
    - name: Pacotes de segurança (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        name: [ufw, fail2ban, unattended-upgrades]
        state: present
        update_cache: true

    - name: Pacotes de segurança (RedHat)
      when: ansible_os_family == "RedHat"
      ansible.builtin.dnf:
        name: [firewalld, fail2ban]
        state: present

    - name: UFW — política padrão (deny in / allow out) [Debian]
      when: ansible_os_family == "Debian"
      community.general.ufw:
        direction: "{{ item.d }}"
        policy: "{{ item.p }}"
      loop:
        - { d: incoming, p: deny }
        - { d: outgoing, p: allow }

    - name: UFW — libera portas essenciais [Debian]
      when: ansible_os_family == "Debian"
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: UFW — habilita [Debian]
      when: ansible_os_family == "Debian"
      community.general.ufw:
        state: enabled

    - name: fail2ban ativo
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Atualizações automáticas de segurança [Debian]
      when: ansible_os_family == "Debian"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: SSH — PermitRootLogin
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: "PermitRootLogin {{ ssh_permit_root_login }}"
        validate: "sshd -t -f %s"
      notify: reiniciar sshd

  handlers:
    - name: reiniciar sshd
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
