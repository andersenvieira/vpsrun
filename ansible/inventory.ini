# Inventário do vpsrun — edite com seus hosts reais.
# A descoberta (discovery.yml) popula o grupo [discovered] em memória.

[zabbix_server]
localhost ansible_connection=local

# Hosts monitorados/gerenciados que você conhece de antemão.
[monitored]
# exemplo: web01 ansible_host=192.168.0.10 ansible_user=root
# exemplo: db01  ansible_host=192.168.0.11 ansible_user=root

# Grupos operacionais para os playbooks de ops/ (use -e 'target=web' etc.).
[web]
# web01

[db]
# db01

# Todos os gerenciáveis (menos o próprio servidor local).
[managed:children]
monitored
web
db

[all:vars]
ansible_python_interpreter=/usr/bin/python3
# Para SSH sem senha, defina a chave/usuário conforme seu ambiente:
# ansible_user=root
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
