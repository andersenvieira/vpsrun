[defaults]
# Executamos os playbooks com cwd = este diretório (ansible/), então os caminhos
# relativos abaixo resolvem para ansible/roles, ansible/inventory.ini, etc.
roles_path = ./roles
inventory = ./inventory.ini
host_key_checking = False
deprecation_warnings = False
retry_files_enabled = False
stdout_callback = default

[ssh_connection]
# Não trava em fingerprint novo/alterado (comum ao reinstalar máquinas na mesma
# faixa de IP). Não grava o known_hosts do controlador.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
